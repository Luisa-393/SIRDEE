<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detección de Dígitos en Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container py-4">
    <h3 class="text-center mb-4">Detección de Dígitos en Video</h3>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="mb-3">
          <label for="videoFile" class="form-label">Seleccionar video:</label>
          <input class="form-control" type="file" id="videoFile" accept="video/mp4,video/*">
        </div>

        <div class="mb-3">
          <label for="modelFile" class="form-label">Seleccionar modelo YOLO (.pt):</label>
          <input class="form-control" type="file" id="modelFile" accept=".pt">
        </div>

        <div class="mb-3">
          <label for="intervalInput" class="form-label">Intervalo de captura (ms):</label>
          <input class="form-control" type="number" id="intervalInput" value="500" min="100">
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary" onclick="uploadVideo()">Subir Video</button>
          <button type="button" class="btn btn-success" onclick="processVideo(event)">Procesar Video</button>

        </div>

        <div class="mt-4 text-center" id="statusLabel">
          <span class="text-muted">Esperando archivo...</span>
        </div>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-body">
        <h6 class="card-title">Resultados por frame:</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-hover" id="resultTable">
            <thead class="table-light">
              <tr>
                <th>Frame</th>
                <th>Resultado</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const supabaseUrl = "https://deccldevwyqsleaxcglh.supabase.co/rest/v1/Weight_carga";
    const supabaseApiKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlY2NsZGV2d3lxc2xlYXhjZ2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ4OTEwMTksImV4cCI6MjA3MDQ2NzAxOX0.wDy8DT_8QeDY0kjW3hInZ6u7ji9J2xSTl-qrdJsB88g";

    // Guardará los registros ya enviados para evitar duplicados
    const registrosSubidos = new Set();

    let ultimoId = 1;  // inicializacion en 0

    async function enviarPeso(frame, intervalMs, pesoKg) {
      const clave = `${frame}-${pesoKg}`;
      if (registrosSubidos.has(clave)) {
        console.log(`Registro duplicado ignorado: Frame ${frame}, ${pesoKg} kg`);
        return;
      }

      try {
        const res = await fetch(supabaseUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": supabaseApiKey,
            "Authorization": `Bearer ${supabaseApiKey}`,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            id: ultimoId++,   // <-- Incrementa el id en cada llamada
            frame: frame,
            intervalo_ms: intervalMs,
            peso_enviado: pesoKg
          })
        });

        if (res.ok) {
          registrosSubidos.add(clave);
          console.log(`Enviado a Supabase: Frame ${frame}, ${pesoKg} kg`);
        } else {
          console.error("Error al enviar:", await res.text());
        }
      } catch (err) {
        console.error("Error de conexión:", err);
      }
    }

    function uploadVideo() {
      const video = document.getElementById('videoFile').files[0];
      const model = document.getElementById('modelFile').files[0];
      if (!video || !model) {
        document.getElementById('statusLabel').innerHTML = '<span class="text-danger">Debe seleccionar un video y un modelo.</span>';
        return;
      }
      document.getElementById('statusLabel').innerHTML = '<span class="text-info">Video y modelo cargados correctamente.</span>';
    }

    function processVideo(event) {
      if (event) event.preventDefault();

      const videoFile = document.getElementById('videoFile').files[0];
      const modelFile = document.getElementById('modelFile').files[0];
      const intervalo = parseInt(document.getElementById('intervalInput').value);

      if (!videoFile || !modelFile) {
        document.getElementById('statusLabel').innerHTML = '<span class="text-danger">Selecciona un video y modelo.</span>';
        return;
      }

      const formData = new FormData();
      formData.append("video", videoFile);
      formData.append("modelo", modelFile);
      formData.append("intervalo_ms", intervalo);

      document.getElementById('statusLabel').innerHTML = '<span class="text-warning">Procesando...</span>';

      fetch("http://localhost:8000/procesar", {
        method: "POST",
        body: formData
      })
        .then(res => res.text())
        .then(text => {
          try {
            const data = JSON.parse(text);
            let resultados = data.resultados;


            // --- VALIDACIÓN POR PROMEDIO ---
            for (let i = 1; i < resultados.length - 1; i++) {
              let anterior = Number(resultados[i - 1].resultado);
              let siguiente = Number(resultados[i + 1].resultado);
              let actual = Number(resultados[i].resultado);

              if (!isNaN(anterior) && !isNaN(siguiente) && !isNaN(actual)) {
                let promedio = (anterior + siguiente) / 2;
                // Reemplazar actual por el más cercano entre anterior y siguiente
                let candidato = Math.abs(promedio - anterior) < Math.abs(promedio - siguiente)
                  ? anterior
                  : siguiente;

                // Si el actual no está cerca del promedio, lo corregimos
                if (Math.abs(actual - promedio) > Math.abs(candidato - promedio)) {
                  resultados[i].resultado = candidato;
                }
              }
            }
            // --- FIN VALIDACIÓN POR PROMEDIO ---

            const tbody = document.querySelector('#resultTable tbody');
            tbody.innerHTML = ''; // limpiar tabla previa

            resultados.forEach(r => {
              const tr = document.createElement('tr');

              const tdFrame = document.createElement('td');
              tdFrame.textContent = r.frame;

              const tdResultado = document.createElement('td');
              tdResultado.textContent = r.resultado;

              tr.appendChild(tdFrame);
              tr.appendChild(tdResultado);
              tbody.appendChild(tr);

              // Enviar a Supabase si es número y no está repetido
              const pesoKg = Number(r.resultado);
              if (!isNaN(pesoKg)) {
                enviarPeso(r.frame, intervalo, pesoKg);
              }
            });

            document.getElementById('statusLabel').innerHTML = '<span class="text-success">Procesamiento finalizado.</span>';
          } catch (err) {
            console.error("Error al parsear JSON:", err);
            console.warn("Texto recibido:", text);
            document.getElementById('statusLabel').innerHTML = '<span class="text-danger">Respuesta inválida del servidor.</span>';
          }
        })
        .catch(err => {
          console.error("Error durante fetch:", err);
          document.getElementById('statusLabel').innerHTML = '<span class="text-danger">Error durante el procesamiento.</span>';
        });
    }
  </script>


</body>

</html>
